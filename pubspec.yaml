name: sitetrack
description: Backend API for SiteTrack, a construction project and materials tracker.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.8
  # 3.6.0 (released 2026-11-04) changes how pooled connections are reset; stay on 3.5
  # until it has settled.
  postgres: 3.5.20
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
